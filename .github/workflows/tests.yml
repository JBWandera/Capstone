name: Tests

on:
  push:
    branches: [afroviewz, main]
    paths: ["src/**", "tests/**", "pyproject.toml"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pycocotools
      - run: pytest -q

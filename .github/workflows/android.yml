name: Android APK

# Builds the AfroViewz Android app (Capacitor wrapper around the static web app)
# and attaches a debug APK to the run. Download it from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [afroviewz, main]
    paths: ["web/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app (downloads the public model)
        run: |
          npm run build
          test -f out/models/afroviewz-nano-roi-fp16.onnx || { echo "::error::Model missing after build."; exit 1; }
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: afroviewz-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish the APK as the "android" release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/android/app/build/outputs/apk/debug/app-debug.apk AfroViewz.apk
          gh release delete android --cleanup-tag --yes || true
          gh release create android AfroViewz.apk \
            --target "$GITHUB_SHA" --latest \
            --title "AfroViewz Android app" \
            --notes "Install on Android: open this page on the phone, tap AfroViewz.apk, then allow installs from your browser when asked. Built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y'). Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AfroViewz.apk"
